<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Klopfen</title>
<style>
  :root{
    color-scheme: dark;
  }
  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  html, body{
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
  }
  body{
    background: #050505;
    color: #8a8a8a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    touch-action: manipulation;
  }

  .stage{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vh, 40px);
    width: 100%;
    height: 100%;
  }

  .circle-wrap{
    position: relative;
    width: min(46vmin, 320px);
    height: min(46vmin, 320px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow{
    position: absolute;
    inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(199,44,44,0.35) 0%, rgba(199,44,44,0) 70%);
    filter: blur(4px);
    opacity: 0.6;
    pointer-events: none;
    transform: scale(1);
    transition: opacity 0.8s ease;
  }

  .circle{
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #e2555c 0%, #c1272d 55%, #921015 100%);
    box-shadow: 0 0 40px rgba(180, 30, 30, 0.28), inset 0 0 30px rgba(0,0,0,0.25);
    transform: scale(1);
    will-change: transform;
  }

  .ripple{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(230,90,95,0.55);
    opacity: 0;
    pointer-events: none;
    transform: scale(1);
  }

  .label{
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #7a7a7a;
    font-weight: 500;
    opacity: 1;
    transition: opacity 0.9s ease;
    text-align: center;
    min-height: 1.2em;
  }
  .label.hidden{ opacity: 0; }

  .status{
    position: absolute;
    bottom: clamp(48px, 10vh, 90px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 0.04em;
    color: #9a9a9a;
    opacity: 0;
    transition: opacity 1.1s ease;
    text-align: center;
    width: 80%;
    line-height: 1.6;
    pointer-events: none;
  }
  .status.show{ opacity: 1; }

  .end-btn{
    position: absolute;
    bottom: clamp(16px, 5vh, 40px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: #666;
    background: none;
    border: none;
    padding: 10px 18px;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
    font-family: inherit;
  }
  .end-btn.show{ opacity: 1; pointer-events: auto; }
  .end-btn:active{ color: #999; }

  .mode-toggle{
    position: absolute;
    top: env(safe-area-inset-top, 18px);
    right: 18px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 0;
    opacity: 0.16;
    transition: opacity 0.4s ease;
    z-index: 5;
  }
  .mode-toggle:active{ opacity: 0.5; }
  .mode-toggle.hidden{ opacity: 0; pointer-events: none; }
  .mode-toggle svg{ width: 14px; height: 14px; }

  .mode-toast{
    position: absolute;
    top: clamp(40px, 8vh, 70px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a8a8a;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .mode-toast.show{ opacity: 1; }

  .tap-zone{
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  @keyframes breathe{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.22); }
  }
  @keyframes breatheGlow{
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .circle.breathing{
    animation: breathe 2.6s ease-in-out infinite;
  }
  .glow.breathing{
    animation: breatheGlow 2.6s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="stage">
  <button class="mode-toggle" id="modeToggle" aria-label="Modus wechseln">
    <svg viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round">
      <circle cx="5" cy="12" r="1.6" fill="#aaa" stroke="none"/>
      <circle cx="12" cy="12" r="1.6" fill="#aaa" stroke="none"/>
      <circle cx="19" cy="12" r="1.6" fill="#aaa" stroke="none"/>
    </svg>
  </button>

  <div class="mode-toast" id="modeToast"></div>

  <div class="circle-wrap" id="circleWrap">
    <div class="glow" id="glow"></div>
    <div class="circle" id="circle">
      <div class="ripple" id="ripple"></div>
    </div>
    <div class="tap-zone" id="tapZone"></div>
  </div>

  <div class="label" id="label">Klopfen</div>

  <div class="status" id="status" aria-live="polite"></div>
  <button class="end-btn" id="endBtn">beenden</button>
</div>

<script>
(function(){
  "use strict";

  var circle = document.getElementById('circle');
  var glow = document.getElementById('glow');
  var ripple = document.getElementById('ripple');
  var tapZone = document.getElementById('tapZone');
  var label = document.getElementById('label');
  var status = document.getElementById('status');
  var endBtn = document.getElementById('endBtn');
  var modeToggle = document.getElementById('modeToggle');
  var modeToast = document.getElementById('modeToast');
  var circleWrap = document.getElementById('circleWrap');

  var MODE_TAP = 'tap';
  var MODE_PULSE = 'pulse';
  var mode = MODE_TAP;

  var sessionActive = false;
  var timer30 = null;
  var timer120 = null;
  var statusClearTimeout = null;
  var currentPulseAnim = null;
  var currentRippleAnim = null;

  var LABELS = {};
  LABELS[MODE_TAP] = 'Klopfen';
  LABELS[MODE_PULSE] = 'Pulsieren';

  var TOAST_LABELS = {};
  TOAST_LABELS[MODE_TAP] = 'Modus: Klopfen';
  TOAST_LABELS[MODE_PULSE] = 'Modus: Pulsieren';

  function setIdleLabel(){
    label.textContent = LABELS[mode];
    label.classList.remove('hidden');
  }

  function updateIdlePreview(){
    if (sessionActive) return;
    if (mode === MODE_PULSE){
      circle.classList.add('breathing');
      glow.classList.add('breathing');
    } else {
      circle.classList.remove('breathing');
      glow.classList.remove('breathing');
    }
  }

  setIdleLabel();

  // ---- Tap feedback (bilateral knock pulse) ----
  function knockPulse(){
    if (currentPulseAnim) { currentPulseAnim.cancel(); }
    currentPulseAnim = circle.animate([
      { transform: 'scale(1)' },
      { transform: 'scale(1.16)', offset: 0.18 },
      { transform: 'scale(1)' }
    ], { duration: 620, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });

    glow.animate([
      { opacity: 0.55 },
      { opacity: 1, offset: 0.18 },
      { opacity: 0.5 }
    ], { duration: 700, easing: 'ease-out' });
  }

  function ringFeedback(){
    if (currentRippleAnim) currentRippleAnim.cancel();
    currentRippleAnim = ripple.animate([
      { transform: 'scale(1)', opacity: 0.7 },
      { transform: 'scale(1.5)', opacity: 0 }
    ], { duration: 750, easing: 'ease-out' });
  }

  // ---- Messages ----
  function showStatus(text, opts){
    opts = opts || {};
    clearTimeout(statusClearTimeout);
    status.textContent = text;
    status.classList.add('show');
    if (opts.temporary){
      statusClearTimeout = setTimeout(function(){
        status.classList.remove('show');
      }, 4200);
    }
    if (opts.withEnd){
      setTimeout(function(){
        endBtn.classList.add('show');
      }, 2200);
    }
  }

  function clearStatus(){
    clearTimeout(statusClearTimeout);
    status.classList.remove('show');
    endBtn.classList.remove('show');
    status.textContent = '';
  }

  // ---- Session lifecycle ----
  function startSession(){
    if (sessionActive) return;
    sessionActive = true;
    label.classList.add('hidden');
    modeToggle.classList.add('hidden');
    circle.classList.remove('breathing');
    glow.classList.remove('breathing');

    if (mode === MODE_PULSE){
      // slight delay so the very first tap still feels like a response
      circle.classList.add('breathing');
      glow.classList.add('breathing');
    }

    timer30 = setTimeout(function(){
      showStatus('Weiter', { temporary: true });
    }, 30000);

    timer120 = setTimeout(function(){
      showStatus('Du kannst aufhören, wenn du möchtest.', { withEnd: true });
    }, 120000);
  }

  function endSession(){
    if (!sessionActive) return;
    sessionActive = false;
    clearTimeout(timer30);
    clearTimeout(timer120);
    clearStatus();
    circle.classList.remove('breathing');
    glow.classList.remove('breathing');
    modeToggle.classList.remove('hidden');
    setIdleLabel();
    updateIdlePreview();
  }

  // ---- Input handling ----
  function handleTap(e){
    e.preventDefault();
    if (!sessionActive){
      startSession();
    }
    if (mode === MODE_TAP){
      knockPulse();
    } else {
      ringFeedback();
    }
  }

  tapZone.addEventListener('pointerdown', handleTap, { passive: false });

  // keyboard fallback (desktop, accessibility)
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'Enter'){
      if (document.activeElement === endBtn || document.activeElement === modeToggle) return;
      e.preventDefault();
      handleTap(e);
    }
  });

  endBtn.addEventListener('pointerdown', function(e){
    e.preventDefault();
    e.stopPropagation();
    endSession();
  });

  modeToggle.addEventListener('pointerdown', function(e){
    e.preventDefault();
    e.stopPropagation();
    if (sessionActive) return;
    mode = (mode === MODE_TAP) ? MODE_PULSE : MODE_TAP;
    setIdleLabel();
    updateIdlePreview();
    modeToast.textContent = TOAST_LABELS[mode];
    modeToast.classList.add('show');
    setTimeout(function(){
      modeToast.classList.remove('show');
    }, 1400);
  });

  // Prevent context menu / long-press callout
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // Prevent iOS double-tap-to-zoom edge cases
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

})();
</script>
</body>
</html>
