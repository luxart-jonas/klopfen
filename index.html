<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Klopfen — ein digitales Klopfobjekt für achtsames, bilaterales Klopfen.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="favicon.ico">
<title>Klopfen</title>
<style>
  :root{ color-scheme: dark; }
  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  html, body{ height: 100%; margin: 0; overscroll-behavior: none; }
  body{
    background: #050505;
    color: #8a8a8a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    touch-action: manipulation;
  }

  .stage{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(22px, 3.4vh, 34px);
    width: 100%;
    height: 100%;
    padding: 0 24px;
  }

  .circle-wrap{
    position: relative;
    width: min(46vmin, 300px);
    height: min(46vmin, 300px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .glow{
    position: absolute;
    inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(199,44,44,0.35) 0%, rgba(199,44,44,0) 70%);
    filter: blur(4px);
    opacity: 0.55;
    pointer-events: none;
  }

  .circle{
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #e2555c 0%, #c1272d 55%, #921015 100%);
    box-shadow: 0 0 40px rgba(180, 30, 30, 0.28), inset 0 0 30px rgba(0,0,0,0.25);
    transform: scale(1);
    will-change: transform;
  }

  .ripple{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(230,90,95,0.6);
    opacity: 0;
    pointer-events: none;
  }

  .tap-zone{ position: absolute; inset: 0; z-index: 1; }

  .text-block{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    max-width: 340px;
  }

  .phase-label{
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #6a6a6a;
    font-weight: 500;
  }

  .instruction{
    font-size: 16px;
    line-height: 1.55;
    color: #b0b0b0;
    font-weight: 400;
    min-height: 2.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.25s ease;
  }

  .legend{
    font-size: 12px;
    line-height: 1.5;
    color: #666;
    opacity: 0;
    max-height: 0;
    transition: opacity 0.5s ease, max-height 0.5s ease;
  }
  .legend.show{ opacity: 1; max-height: 4em; }

  .counter{
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #666;
    font-variant-numeric: tabular-nums;
  }

  .end-btn{
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom, 18px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: #555;
    background: none;
    border: none;
    padding: 12px 20px;
    opacity: 0.28;
    transition: opacity 0.3s ease;
    font-family: inherit;
    z-index: 2;
  }
  .end-btn:active{ opacity: 0.7; color: #999; }

  .version{
    position: absolute;
    bottom: max(10px, env(safe-area-inset-bottom, 10px));
    right: 14px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: #3d3d3d;
    z-index: 2;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="circle-wrap" id="circleWrap">
    <div class="glow" id="glow"></div>
    <div class="circle" id="circle">
      <div class="ripple" id="ripple"></div>
    </div>
    <div class="tap-zone" id="tapZone"></div>
  </div>

  <div class="text-block">
    <div class="phase-label" id="phaseLabel">Bereit</div>
    <div class="instruction" id="instruction" aria-live="polite">Tippe auf den Punkt, um zu beginnen.</div>
    <div class="legend" id="legend">Einatmen: 1× klopfen · Ausatmen: 4× klopfen (langsam)</div>
    <div class="counter" id="counter"></div>
  </div>

  <button class="end-btn" id="endBtn">beenden</button>
  <div class="version" id="version"></div>
</div>

<script>
(function(){
  "use strict";

  var APP_VERSION = "2.2.0";
  document.getElementById('version').textContent = 'v' + APP_VERSION;

  var circle = document.getElementById('circle');
  var glow = document.getElementById('glow');
  var ripple = document.getElementById('ripple');
  var tapZone = document.getElementById('tapZone');
  var phaseLabelEl = document.getElementById('phaseLabel');
  var instructionEl = document.getElementById('instruction');
  var legendEl = document.getElementById('legend');
  var counterEl = document.getElementById('counter');
  var endBtn = document.getElementById('endBtn');

  var PHASES = [
    {
      key: 'warmup',
      label: 'Ankommen',
      total: 20,
      minInterval: 1000,
      text: 'Klopfe langsam – mindestens eine Sekunde zwischen den Klopfern.'
    },
    {
      key: 'rhythm',
      label: 'Rhythmus',
      total: 50,
      text: 'Finde deinen eigenen Rhythmus. Klopfe in jedem Tempo – keine Zeitbegrenzung.'
    },
    {
      key: 'breathing',
      label: 'Atmen',
      total: null,
      text: null // dynamic
    }
  ];

  // ---- Automatische Einstiegs-Atemsequenz -------------------------------
  // Ein Tap auf den Punkt startet die Sequenz von selbst. Zyklus (8s):
  //   2s deutliches Dauerrasseln  = Einatmen
  //   6s Einzelimpulse im Sekundentakt (6x) = Ausatmen
  // Wiederholt für insgesamt 2 Minuten (15 Zyklen à 8s), danach beginnt
  // der bisherige, manuell getappte Ablauf (PHASES oben).
  var AUTO_INHALE_MS = 2000;
  var AUTO_EXHALE_MS = 6000;
  var AUTO_EXHALE_PULSES = 6;
  var AUTO_TOTAL_MS = 120000;

  // appState: 'idle' (wartet auf ersten Tap) -> 'auto' (automatische Sequenz)
  //           -> 'manual' (bisheriger, tap-gesteuerter Ablauf)
  var appState = 'idle';
  var autoRunId = 0;
  var autoTimeoutIds = [];

  var phaseIndex = 0;
  var countInPhase = 0;
  var breathTapCount = 0;
  var lastCountedWarmupTap = 0;
  var currentPulseAnim = null;
  var currentRippleAnim = null;

  // Vibration API only controls duration/pattern, not amplitude — this is the
  // strongest, longest pattern that still feels responsive on a tap.
  var VIBE_TAP = [55];
  var VIBE_PHASE_CHANGE = [80, 50, 80, 50, 80];
  var VIBE_TOO_FAST = [12];

  function buildRattlePattern(totalMs, onMs, offMs){
    var pattern = [];
    var t = 0;
    while (t < totalMs){
      pattern.push(onMs);
      t += onMs;
      if (t < totalMs){
        pattern.push(offMs);
        t += offMs;
      }
    }
    return pattern;
  }
  var VIBE_RATTLE = buildRattlePattern(AUTO_INHALE_MS, 45, 45); // deutliches Dauerrasseln

  function vibrate(pattern){
    if (navigator.vibrate){
      try { navigator.vibrate(pattern); } catch(e) {}
    }
  }

  function clearAutoTimers(){
    autoTimeoutIds.forEach(function(id){ clearTimeout(id); });
    autoTimeoutIds = [];
  }

  function render(){
    var phase = PHASES[phaseIndex];
    phaseLabelEl.textContent = phase.label;

    if (phase.key === 'breathing'){
      legendEl.classList.add('show');
      var step = breathTapCount % 5; // 0 = about to inhale, 1..4 = exhale taps
      if (step === 0){
        instructionEl.textContent = 'Einatmen — klopfen';
        counterEl.textContent = '';
      } else {
        instructionEl.textContent = 'Ausatmen — klopfen';
        counterEl.textContent = step + ' / 4';
      }
    } else {
      legendEl.classList.remove('show');
      instructionEl.textContent = phase.text;
      counterEl.textContent = countInPhase + ' / ' + phase.total;
    }
  }

  function renderIdle(){
    phaseLabelEl.textContent = 'Bereit';
    legendEl.classList.remove('show');
    instructionEl.textContent = 'Tippe auf den Punkt, um zu beginnen.';
    counterEl.textContent = '';
  }

  function advancePhaseIfNeeded(){
    var phase = PHASES[phaseIndex];
    if (phase.total !== null && countInPhase >= phase.total && phaseIndex < PHASES.length - 1){
      phaseIndex += 1;
      countInPhase = 0;
      vibrate(VIBE_PHASE_CHANGE); // distinct pulse marks a phase change
    }
  }

  function knockPulse(){
    if (currentPulseAnim) currentPulseAnim.cancel();
    currentPulseAnim = circle.animate([
      { transform: 'scale(1)' },
      { transform: 'scale(1.24)', offset: 0.16 },
      { transform: 'scale(1)' }
    ], { duration: 620, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });

    glow.animate([
      { opacity: 0.55 },
      { opacity: 1, offset: 0.16 },
      { opacity: 0.5 }
    ], { duration: 700, easing: 'ease-out' });

    if (currentRippleAnim) currentRippleAnim.cancel();
    currentRippleAnim = ripple.animate([
      { transform: 'scale(1)', opacity: 0.65 },
      { transform: 'scale(1.45)', opacity: 0 }
    ], { duration: 700, easing: 'ease-out' });
  }

  function flutterPulse(){
    // Visuelles Gegenstück zum Dauerrasseln: der Kreis "zittert" durchgehend
    // über die vollen 2 Sekunden.
    if (currentPulseAnim) currentPulseAnim.cancel();
    var steps = 16;
    var kf = [];
    for (var i = 0; i <= steps; i++){
      kf.push({ transform: 'scale(' + (i % 2 === 0 ? 1.07 : 1) + ')', offset: i / steps });
    }
    currentPulseAnim = circle.animate(kf, { duration: AUTO_INHALE_MS, easing: 'ease-in-out' });

    glow.animate([
      { opacity: 0.5 },
      { opacity: 0.95 },
      { opacity: 0.5 }
    ], { duration: 500, iterations: AUTO_INHALE_MS / 500, easing: 'ease-in-out' });
  }

  // ---- Auto-Sequenz -------------------------------------------------------

  function runInhale(runId){
    if (runId !== autoRunId) return;
    phaseLabelEl.textContent = 'Automatik';
    legendEl.classList.remove('show');
    instructionEl.textContent = 'Einatmen';
    counterEl.textContent = '';
    flutterPulse();
    vibrate(VIBE_RATTLE);
  }

  function runExhalePulse(runId, n){
    if (runId !== autoRunId) return;
    instructionEl.textContent = 'Ausatmen';
    counterEl.textContent = n + ' / ' + AUTO_EXHALE_PULSES;
    knockPulse();
    vibrate(VIBE_TAP);
  }

  function runAutoCycle(runId, elapsedMs){
    if (runId !== autoRunId) return;

    if (elapsedMs >= AUTO_TOTAL_MS){
      startManual(runId);
      return;
    }

    runInhale(runId);

    var toExhale = setTimeout(function(){
      if (runId !== autoRunId) return;

      for (var i = 1; i <= AUTO_EXHALE_PULSES; i++){
        (function(n){
          var pulseId = setTimeout(function(){
            runExhalePulse(runId, n);
          }, n * 1000);
          autoTimeoutIds.push(pulseId);
        })(i);
      }

      var toNextCycle = setTimeout(function(){
        runAutoCycle(runId, elapsedMs + AUTO_INHALE_MS + AUTO_EXHALE_MS);
      }, AUTO_EXHALE_MS);
      autoTimeoutIds.push(toNextCycle);

    }, AUTO_INHALE_MS);
    autoTimeoutIds.push(toExhale);
  }

  function startAuto(){
    appState = 'auto';
    autoRunId += 1;
    runAutoCycle(autoRunId, 0);
  }

  function startManual(runId){
    if (runId !== autoRunId) return;
    appState = 'manual';
    phaseIndex = 0;
    countInPhase = 0;
    breathTapCount = 0;
    lastCountedWarmupTap = 0;
    vibrate(VIBE_PHASE_CHANGE);
    render();
  }

  function resetToIdle(){
    clearAutoTimers();
    autoRunId += 1; // invalidiert alle noch laufenden Auto-Timeouts
    appState = 'idle';
    phaseIndex = 0;
    countInPhase = 0;
    breathTapCount = 0;
    lastCountedWarmupTap = 0;
    renderIdle();
  }

  function handleTap(e){
    e.preventDefault();

    if (appState === 'idle'){
      knockPulse();
      vibrate(VIBE_TAP);
      startAuto();
      return;
    }

    if (appState === 'auto'){
      // Sequenz läuft von selbst — Taps werden während dieser Phase ignoriert.
      return;
    }

    // appState === 'manual': bisheriger, tap-gesteuerter Ablauf.
    var phase = PHASES[phaseIndex];
    var now = Date.now();

    // In der Ankommen-Phase zählt ein Klopfer nur, wenn seit dem letzten
    // gezählten Klopfer mindestens minInterval vergangen ist — schnellere
    // Klopfer geben trotzdem Feedback (Kreis + Vibration), zählen aber nicht.
    var tooFast = phase.minInterval && lastCountedWarmupTap !== 0 &&
                  (now - lastCountedWarmupTap) < phase.minInterval;

    knockPulse();
    vibrate(tooFast ? VIBE_TOO_FAST : VIBE_TAP);

    if (tooFast) return;

    if (phase.key === 'breathing'){
      breathTapCount += 1;
    } else {
      countInPhase += 1;
      if (phase.minInterval) lastCountedWarmupTap = now;
    }
    advancePhaseIfNeeded();
    render();
  }

  tapZone.addEventListener('pointerdown', handleTap, { passive: false });

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'Enter'){
      if (document.activeElement === endBtn) return;
      e.preventDefault();
      handleTap(e);
    }
  });

  endBtn.addEventListener('pointerdown', function(e){
    e.preventDefault();
    e.stopPropagation();
    resetToIdle();
  });

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

  renderIdle();
})();
</script>
</body>
</html>
